<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>กล้องถ่ายภาพลายผ้าไทย</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; font-family: system-ui, sans-serif; background: #f7f5f1; color: #29251f; }
    main { max-width: 620px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { line-height: 1.5; }
    video, canvas, img.preview { width: 100%; border-radius: 14px; background: #1d1d1d; display: block; }
    canvas { display: none; }
    .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; font-size: 1rem; cursor: pointer; }
    #startBtn, #captureBtn { background: #2f5d50; color: white; }
    #sendBtn { background: #262626; color: white; }
    #stopBtn { background: #e7e0d7; color: #29251f; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #status { padding: 10px 12px; background: white; border-radius: 10px; white-space: pre-wrap; }
    .small { font-size: .9rem; color: #625c54; }
  </style>
</head>
<body>
<main>
  <h1>ถ่ายภาพลายผ้าไทย</h1>
  <p class="small">อนุญาตให้ใช้กล้องเมื่อเบราว์เซอร์ถาม จากนั้นจัดผ้าให้อยู่ในกรอบและกดถ่ายภาพ</p>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <img id="preview" class="preview" alt="ภาพตัวอย่างที่ถ่าย" hidden>
  <div class="buttons">
    <button id="startBtn">เปิดกล้อง</button>
    <button id="captureBtn" disabled>ถ่ายภาพ</button>
    <button id="sendBtn" disabled>ส่งภาพกลับหน้าเว็บ</button>
    <button id="stopBtn" disabled>ปิดกล้อง</button>
  </div>
  <div id="status" role="status">พร้อมเปิดกล้อง</div>
</main>
<script>
(() => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const preview = document.getElementById('preview');
  const status = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const captureBtn = document.getElementById('captureBtn');
  const sendBtn = document.getElementById('sendBtn');
  const stopBtn = document.getElementById('stopBtn');
  let stream = null;
  let capturedDataUrl = null;

  const params = new URLSearchParams(location.search);
  const parentOrigin = params.get('parentOrigin');
  const validParentOrigin = parentOrigin &&
    (parentOrigin === 'https://script.google.com' ||
     /^https:\/\/[a-z0-9-]+\.script\.googleusercontent\.com$/i.test(parentOrigin));

  function setStatus(message) { status.textContent = message; }

  async function startCamera() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('เบราว์เซอร์นี้ไม่รองรับกล้อง หรือไม่ได้เปิดผ่าน HTTPS');
      }
      stopCamera();
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      captureBtn.disabled = false;
      stopBtn.disabled = false;
      setStatus('เปิดกล้องแล้ว จัดผ้าให้อยู่ในภาพแล้วกด “ถ่ายภาพ”');
    } catch (err) {
      console.error(err);
      let message = err.message || String(err);
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        message = 'ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณากดไอคอนตั้งค่าเว็บไซต์ข้างแถบที่อยู่ แล้วอนุญาต Camera จากนั้นลองใหม่';
      } else if (err.name === 'NotFoundError') {
        message = 'ไม่พบกล้องที่ใช้งานได้บนอุปกรณ์นี้';
      }
      setStatus('เปิดกล้องไม่สำเร็จ: ' + message);
    }
  }

  function capturePhoto() {
    if (!video.videoWidth || !video.videoHeight) {
      setStatus('กล้องยังไม่พร้อม กรุณารอสักครู่แล้วลองใหม่');
      return;
    }
    const maxSide = 1600;
    const scale = Math.min(1, maxSide / Math.max(video.videoWidth, video.videoHeight));
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    capturedDataUrl = canvas.toDataURL('image/jpeg', 0.88);
    preview.src = capturedDataUrl;
    preview.hidden = false;
    video.hidden = true;
    sendBtn.disabled = false;
    setStatus('ถ่ายภาพแล้ว หากภาพชัดให้กด “ส่งภาพกลับหน้าเว็บ” หรือเปิดกล้องใหม่เพื่อถ่ายอีกครั้ง');
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    video.srcObject = null;
    stopBtn.disabled = true;
    if (!video.hidden) captureBtn.disabled = true;
  }

  startBtn.addEventListener('click', startCamera);
  captureBtn.addEventListener('click', capturePhoto);
  stopBtn.addEventListener('click', () => {
    stopCamera();
    setStatus('ปิดกล้องแล้ว');
  });
  sendBtn.addEventListener('click', () => {
    if (!capturedDataUrl) return;
    if (!validParentOrigin) {
      setStatus('ไม่พบต้นทางหน้าเว็บหลักที่ถูกต้อง กรุณาเปิดหน้านี้จากปุ่มกล้องในเว็บจำแนกลายผ้าไทย');
      return;
    }
    if (!window.opener || window.opener.closed) {
      setStatus('ไม่พบหน้าเว็บหลัก กรุณาปิดหน้านี้แล้วเปิดกล้องจากหน้าเว็บหลักอีกครั้ง');
      return;
    }
    window.opener.postMessage({
      type: 'FABRIC_CAMERA_IMAGE',
      dataUrl: capturedDataUrl
    }, parentOrigin);
    setStatus('ส่งภาพกลับแล้ว คุณสามารถกลับไปยังหน้าเว็บหลักได้');
    stopCamera();
  });

  window.addEventListener('beforeunload', stopCamera);
})();
</script>
</body>
</html>
